services:
  - type: web
    name: mixio-organic
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: MOLLIE_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false
